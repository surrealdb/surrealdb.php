name: CI

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["main"]
  # Every pull request, including ones stacked on another branch.
  pull_request:

jobs:

  phpstan:
    runs-on: ubuntu-latest

    steps:

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.4'
        extensions: openswoole-26.2.0

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Run static analysis
      run: composer analyse

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nightly builds can break for reasons unrelated to this repository, so a
    # failure there is reported without blocking the run.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported major, the latest 3.x release, and nightly.
        version: [v2.6.2, v3.3.4, nightly]
        php_version: ['8.4']

    steps:

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # setup php version
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php_version }}
        extensions: openswoole-26.2.0

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist

    - name: SurrealDB in Github Actions
      uses: surrealdb/setup-surreal@7c103070ba4f544240cd287432ba70d6f50163a5 # v2.0.1
      with:
        surrealdb_version: ${{ matrix.version }}
        surrealdb_auth: true
        surrealdb_username: 'root'
        surrealdb_password: 'root'
        surrealdb_additional_args: --allow-all
        surrealdb_strict: true

    - name: Run tests
      env:
        SURREALDB_REQUIRE_LOCAL: '1'
      run: composer test

    - name: Run FrankenPHP (Amp/Revolt) runtime tests
      env:
        SURREALDB_REQUIRE_LOCAL: '1'
      run: composer test:frankenphp

    - name: Run OpenSwoole runtime tests
      env:
        SURREALDB_REQUIRE_LOCAL: '1'
      run: composer test:openswoole
