name: Push Release

on:
  release:
    types: [published]

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:

  ci:
    name: CI Job
    uses: ./.github/workflows/ci.yml
    permissions: 
      contents: read
      pull-requests: read

  update_tag:
    name: Update Tag Job
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Update the ${{ github.event.release.tag_name }} tag
        uses: actions/publish-action@f784495ce78a41bac4ed7e34a73f0034015764bb # v0.3.0
        with:
          source-tag: ${{ github.event.release.tag_name }}

  upload_packagist:
    name: Upload to Packagist Job
    runs-on: ubuntu-latest
    needs: [update_tag]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Update package
        run: |
          curl -X POST \
            -H'content-type:application/json' \
            'https://packagist.org/api/update-package?username=${{ secrets.USERNAME }}&apiToken=${{ secrets.API_TOKEN}}' \
            -d'{"repository":{"url":"${{ secrets.REPOSITORY_URL }}"}}'